<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#146b61">
 <title>内部练习入口</title><link rel="stylesheet" href="./styles.css"><script type="module" src="./gate.js"></script>
</head>
<body>
 <main id="gate" class="gate-wrap">
  <section class="gate-card"><div class="gate-icon" aria-hidden="true">⌑</div><p class="eyebrow">仅限获邀人员</p><h1>内部练习入口</h1><p class="muted small-text">请输入发给你的专属访问码。题库内容将在验证后解密。</p>
   <form id="unlock-form"><label class="gate-label" for="access-code">专属访问码</label><input id="access-code" class="field gate-input" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="粘贴你的访问码" required>
    <label class="checkbox-row"><input id="remember-session" type="checkbox">在当前标签页保持登录，最多8小时</label><button id="unlock-button" class="btn wide" type="submit">进入练习</button><p id="unlock-message" class="gate-error" role="alert" hidden></p>
   </form><p class="gate-footer">请妥善保管访问码，仅向获邀人员提供。仅有网址无法读取题库。</p>
  </section>
 </main>
 <div id="study-shell" hidden>
  <header class="site-header"><div class="header-inner"><a class="brand" href="./" aria-label="练习首页"><span class="brand-mark">练</span><span><strong id="brand-title">内部题库</strong><small>理解记忆 · 反复练习</small></span></a><div class="inline-actions"><button id="share" class="btn quiet small" type="button">分享链接 ↗</button><button id="exit-study" class="btn secondary small" type="button">退出</button></div></div></header>
  <div id="storage-note" class="storage-note" role="status" hidden></div><main id="app" class="main" tabindex="-1"><p class="loading">正在打开题库…</p></main>
  <nav class="bottom-nav" aria-label="主导航"><button type="button" data-route="home"><span>▤</span>练习</button><button type="button" data-route="search"><span>⌕</span>查题</button><button type="button" data-route="wrong"><span>◎</span>错题本</button><button type="button" data-route="history"><span>▥</span>学习记录</button></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div><div id="modal-root"></div>
 </div><noscript>请使用支持 JavaScript 和安全解密的浏览器打开。</noscript>
</body></html>
